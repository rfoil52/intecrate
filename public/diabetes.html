<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Diabetes: The First 3 Months</title>
    <meta name="description" content="A library of voices for people newly diagnosed with type 2 diabetes. Hear from others who have walked the first three months — anonymously, at your own pace.">
    <meta name="theme-color" content="#F5F0E6">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Diabetes: The First 3 Months">
    <meta property="og:description" content="A library of voices for the people walking this road. You are not alone in the first three months.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%239A6A4F'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#F5F0E6;        /* warm cream — not pure white */
            --bg2:#ECE4D4;       /* agent bubble / panel */
            --bg3:#DDD2BE;       /* hairline borders */
            --text:#3A352E;      /* warm near-black */
            --text2:#6E665A;     /* muted */
            --text3:#9A9082;     /* faint */
            --accent:#9A6A4F;    /* clay / earth */
            --accent-soft:rgba(154,106,79,.10);
            --accent-mid:rgba(154,106,79,.22);
            --serif:'Lora',Georgia,'Times New Roman',serif;
            --display:'DM Serif Display',Georgia,serif;
        }
        body{font-family:var(--serif);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6}

        .app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

        /* HEADER */
        .header{padding:26px 28px 20px;text-align:center;flex-shrink:0}
        .header h1{font-family:var(--display);font-size:30px;font-weight:400;letter-spacing:.01em;line-height:1.15}
        .header .sub{font-size:14px;color:var(--text2);font-style:italic;margin-top:8px}

        /* WELCOME */
        .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 24px 24px;text-align:center}
        .vidwrap{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(58,53,46,.10)}
        .welcome-vid{width:100%;display:block;background:#000}
        .unmute{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 20px;border:none;border-radius:24px;background:rgba(58,53,46,.82);color:#fff;font-family:var(--serif);font-size:14px;cursor:pointer;backdrop-filter:blur(4px);transition:opacity .2s}
        .unmute:hover{opacity:.9}
        .welcome .loading{padding:60px 0;color:var(--text3);font-style:italic;font-size:16px}
        .skip{margin-top:20px;background:none;border:none;color:var(--text3);font-family:var(--serif);font-size:14px;cursor:pointer;padding:6px 10px}
        .skip:hover{color:var(--text2)}

        /* CONVERSATION */
        .messages{flex:1;overflow-y:auto;padding:22px 26px 10px;scroll-behavior:smooth}
        .msg{margin-bottom:16px;display:flex;flex-direction:column;animation:fadeIn .35s ease}
        .msg.agent{align-items:flex-start}.msg.user{align-items:flex-end}
        .bubble{max-width:84%;padding:14px 20px;font-size:17px;line-height:1.62}
        .agent .bubble{background:var(--bg2);border-radius:18px 18px 18px 5px;color:var(--text)}
        .user .bubble{background:var(--accent);border-radius:18px 18px 5px 18px;color:#FBF7EF}

        /* VOICE CLIP */
        .vc{width:84%;max-width:84%;margin-top:12px;background:var(--accent-soft);border:1px solid var(--accent-mid);border-radius:14px;padding:14px;overflow:hidden}
        .vc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
        .vc-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
        .vc-name{font-family:var(--display);font-size:19px;color:var(--text)}
        .vc-vid{width:100%;border-radius:10px;background:#000;display:block}

        /* INPUT */
        .prompts{position:relative;height:30px;margin:6px 26px 10px;text-align:center}
        .prompt-line{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .7s ease;font-style:italic;font-size:18px;color:var(--text2)}
        .prompt-line.show{opacity:1}
        .input-bar{padding:12px 22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,8px));display:flex;gap:10px;flex-shrink:0}
        .input-bar input{flex:1;min-width:0;padding:14px 18px;border-radius:26px;border:1px solid var(--bg3);background:#FBF8F1;color:var(--text);font-family:var(--serif);font-size:16px;outline:none;transition:border-color .2s}
        .input-bar input:focus{border-color:var(--accent-mid)}
        .input-bar input:disabled{opacity:.6}
        .send-btn{padding:14px 24px;border-radius:26px;border:none;background:var(--accent);color:#FBF7EF;font-family:var(--serif);font-size:16px;cursor:pointer;flex-shrink:0;transition:opacity .15s}
        .send-btn:hover{opacity:.92}
        .send-btn:disabled{background:var(--bg3);color:var(--text3);cursor:default}

        /* PRIVACY */
        .privacy{padding:4px 28px 22px;text-align:center;font-size:12.5px;color:var(--text3);line-height:1.5;font-style:italic;flex-shrink:0}

        /* TYPING */
        .typing{display:inline-flex;gap:5px;padding:16px 20px;background:var(--bg2);border-radius:18px 18px 18px 5px}
        .typing span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:pulse 1.3s ease infinite}
        .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

        @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
        @media(prefers-reduced-motion:reduce){.msg{animation:none}.prompt-line{transition:opacity .2s}}

        /* MOBILE-FIRST: base styles target phones; scale up on wider screens */
        @media(min-width:600px){
            .header h1{font-size:36px}
            .header .sub{font-size:15px}
        }
        @media(max-width:420px){
            .header{padding:22px 20px 16px}
            .header h1{font-size:26px}
            .messages{padding:18px 18px 8px}
            .bubble{font-size:16px;padding:13px 17px}
            .input-bar{padding:10px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,8px))}
            .prompts{margin:6px 18px 8px}
            .prompt-line{font-size:16px}
            .privacy{padding:4px 20px 18px}
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
    // ---- Config -------------------------------------------------------------
    const S3 = "https://reachum-video-assets.s3.amazonaws.com/diabetes-clips/";
    const WELCOME_FALLBACK = S3 + "RT_intro.mp4";

    const PROMPTS = [
        "Were you surprised?",
        "Were you angry?",
        "Were you scared?",
        "Do you have any regrets?",
        "Are you keeping it to yourself?",
        "Has anyone in your family had diabetes?",
        "Are you overwhelmed by the information?",
        "What's your biggest concern right now?"
    ];

    const PRIVACY = "We don't collect names, emails, or anything that connects what you share to who you are.";

    // ---- State --------------------------------------------------------------
    const S = {
        step: "welcome",     // "welcome" | "chat"
        welcomeUrl: "",
        convo: [],           // [{role,content}] sent to /api/chat
        msgs: [],            // [{r:'a'|'u', t, vid, persona, played}] for rendering
        shown: [],           // clip ids already played
        load: false,         // awaiting API
        wait: false          // a clip is playing
    };
    const $ = document.getElementById("app");

    // Rotating-prompt state
    let pTimer = null, pIdx = 0, pActive = 0, pFrozen = false;

    // ---- Helpers ------------------------------------------------------------
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
    function scrollDown(){setTimeout(()=>{const e=document.getElementById("m");if(e)e.scrollTop=e.scrollHeight},60)}

    async function api(body){
        try{
            const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
            if(!r.ok) throw new Error("HTTP "+r.status);
            return await r.json();
        }catch(e){
            return {error: e.message || "network"};
        }
    }

    // ---- Render -------------------------------------------------------------
    function render(){
        if(S.step === "welcome"){
            $.innerHTML = welcomeHTML();
            wireWelcome();
            return;
        }
        $.innerHTML = chatHTML();
        wireChat();
    }

    function welcomeHTML(){
        const vid = S.welcomeUrl ? `
            <div class="vidwrap">
                <video id="wv" class="welcome-vid" autoplay muted playsinline controls preload="auto">
                    <source src="${S.welcomeUrl}" type="video/mp4">
                </video>
                <button class="unmute" id="unmute">Tap for sound</button>
            </div>
            <button class="skip" id="skip">Skip &rsaquo;</button>`
            : `<div class="loading">Loading&hellip;</div>`;
        return `
            <div class="header">
                <h1>Diabetes: The First 3 Months</h1>
                <div class="sub">A library of voices for the people walking this road</div>
            </div>
            <div class="welcome">${vid}</div>
            <div class="privacy">${PRIVACY}</div>`;
    }

    function chatHTML(){
        let h = S.msgs.map((m,i)=>{
            if(m.r === "u"){
                return `<div class="msg user"><div class="bubble">${esc(m.t)}</div></div>`;
            }
            let o = `<div class="msg agent">`;
            if(m.t) o += `<div class="bubble">${esc(m.t)}</div>`;
            if(m.vid){
                o += `<div class="vc" id="c${i}">
                        <div class="vc-head"><span class="vc-tag">A voice</span><span class="vc-name">${esc(m.persona||"")}</span></div>
                        <video class="vc-vid" id="v${i}" controls playsinline preload="metadata">
                            <source src="${m.vid}" type="video/mp4">
                        </video>
                      </div>`;
            }
            o += `</div>`;
            return o;
        }).join("");

        if(S.load) h += `<div class="msg agent"><div class="typing"><span></span><span></span><span></span></div></div>`;

        const off = S.load || S.wait;
        const promptBlock = S.msgs.length === 0
            ? `<div class="prompts"><span class="prompt-line" id="pl0"></span><span class="prompt-line" id="pl1"></span></div>`
            : "";

        return `
            <div class="header">
                <h1>Diabetes: The First 3 Months</h1>
                <div class="sub">A library of voices for the people walking this road</div>
            </div>
            <div class="messages" id="m">${h}</div>
            ${promptBlock}
            <div class="input-bar">
                <input id="i" type="text" autocomplete="off" placeholder="Or type anything..." ${off?"disabled":""}>
                <button class="send-btn" id="b" ${off?"disabled":""}>Send</button>
            </div>
            <div class="privacy">${PRIVACY}</div>`;
    }

    // ---- Welcome wiring -----------------------------------------------------
    function wireWelcome(){
        const v = document.getElementById("wv");
        if(v){
            v.play().catch(()=>{ /* autoplay blocked — native controls let them start it */ });
            v.addEventListener("ended", toChat, {once:true});
        }
        const um = document.getElementById("unmute");
        if(um) um.addEventListener("click", ()=>{
            if(v){ v.muted = false; v.play().catch(()=>{}); }
            um.style.display = "none";
        });
        const sk = document.getElementById("skip");
        if(sk) sk.addEventListener("click", toChat);
    }

    function toChat(){
        if(S.step === "chat") return;
        S.step = "chat";
        render();
    }

    // ---- Chat wiring --------------------------------------------------------
    function wireChat(){
        const inp = document.getElementById("i");
        const btn = document.getElementById("b");
        const off = S.load || S.wait;

        if(inp){
            inp.addEventListener("keydown", e=>{ if(e.key === "Enter") send(); });
            inp.addEventListener("focus", ()=>{ pFrozen = true; }); // freeze rotation on the visible prompt
            if(!off) setTimeout(()=>inp.focus(), 50);
        }
        if(btn) btn.addEventListener("click", send);

        // Rotating prompts only in the empty (pre-conversation) state
        if(S.msgs.length === 0) startPrompts();
        else stopPrompts();

        // Autoplay the newest unplayed clip; re-enable input when it ends
        const last = S.msgs[S.msgs.length-1];
        if(last && last.r === "a" && last.vid && !last.played){
            last.played = true;
            const v = document.getElementById("v"+(S.msgs.length-1));
            if(v){
                v.play().catch(()=>{ /* blocked — they can tap play */ });
                v.addEventListener("ended", ()=>{ S.wait = false; render(); }, {once:true});
            }
        }
        scrollDown();
    }

    function startPrompts(){
        const a = document.getElementById("pl0");
        if(!a || pTimer) return;
        pFrozen = false; pIdx = 0; pActive = 0;
        a.textContent = PROMPTS[0];
        a.classList.add("show");
        pTimer = setInterval(()=>{
            if(pFrozen) return;
            const next = (pIdx + 1) % PROMPTS.length;
            const cur = document.getElementById("pl"+pActive);
            const inc = document.getElementById("pl"+(1-pActive));
            if(!cur || !inc){ stopPrompts(); return; }
            inc.textContent = PROMPTS[next];
            inc.classList.add("show");   // crossfade in (~700ms via CSS)
            cur.classList.remove("show"); // crossfade out
            pActive = 1 - pActive;
            pIdx = next;
        }, 4700); // ~4s hold + ~0.7s fade
    }

    function stopPrompts(){
        if(pTimer){ clearInterval(pTimer); pTimer = null; }
    }

    // ---- Send ---------------------------------------------------------------
    async function send(){
        const inp = document.getElementById("i");
        if(!inp) return;
        const t = inp.value.trim();
        if(!t || S.load || S.wait) return;
        inp.value = "";
        stopPrompts();

        S.msgs.push({r:"u", t});
        S.convo.push({role:"user", content:t});
        S.load = true;
        render();

        const r = await api({action:"chat", messages:S.convo, shownClips:S.shown});
        S.load = false;

        if(r.error || (!r.text && !r.match)){
            S.msgs.push({r:"a", t:"Something interrupted that. Take your time — say it again whenever you're ready."});
            render();
            return;
        }

        const text = r.text || "";
        if(text) S.convo.push({role:"assistant", content:text});

        if(r.match){
            S.shown.push(r.match);
            S.msgs.push({r:"a", t:text, vid:r.matchUrl, persona:r.matchPersona || ""});
            S.wait = true; // hold input until the clip finishes
        }else{
            S.msgs.push({r:"a", t:text});
        }
        render();
    }

    // ---- Init ---------------------------------------------------------------
    async function init(){
        render(); // shows loading welcome immediately
        const s = await api({action:"start"});
        S.welcomeUrl = (s && s.welcomeUrl) || WELCOME_FALLBACK;
        render();
    }

    init();
</script>
</body>
</html>
